<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#66BB6A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CalcNote Freedom">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="CalcNote Freedom – notepad calculator that works offline">
<title>CalcNote Freedom</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --primary:#66BB6A; --strong:#2E7D32; --on-primary:#fff;
  --bg:#F3F9F3; --surface:#FFFFFF; --surface-2:#EDF3ED; --sidebar:#F7FAF4;
  --text:#1B1F1C; --text-2:#5F6A62; --text-3:#98A29A;
  --res:var(--text); --res-muted:#7E8A80; --res-agg:#1565C0; --neg:#D32F2F;
  --op:#E69100; --fn:#1976D2; --com:#9AA39C;
  --row-border:rgba(0,0,0,.07); --divider:#C9DEC9;
  --row-active:color-mix(in srgb,var(--primary) 14%,var(--bg));
  --total-bg:color-mix(in srgb,var(--primary) 30%,#fff); --total-text:color-mix(in srgb,var(--strong) 85%,#000);
  --keypad-bg:#E7ECE8; --key-bg:#FFFFFF; --key-text:#263238;
  --key-op-bg:color-mix(in srgb,var(--primary) 20%,#fff); --key-op-text:var(--strong);
  --key-fn-bg:#E3EEFB; --key-fn-text:#1565C0; --key-cu-bg:#FFF3E0; --key-cu-text:#E65100;
  --key-nav-bg:#F1F3F2; --key-danger-bg:#FFE5E5; --key-danger-text:#C62828;
  --border:#D5DDD6; --overlay:rgba(0,0,0,.45); --danger:#D32F2F;
  --shadow:0 10px 30px rgba(0,0,0,.18);
  --font-size-editor:20px; --lh:1.6; --editor-font:system-ui,'Segoe UI',Roboto,sans-serif; --editor-style:normal;
  --row-h:calc(var(--font-size-editor) * var(--lh));
  --result-width:36%; --num-w:34px; --key-h:50px; --ed-top:4px;
  --header-h:56px; --total-h:54px;
  --safe-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));
  --safe-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
  --safe-left:var(--safe-area-inset-left,env(safe-area-inset-left,0px));
  --safe-right:var(--safe-area-inset-right,env(safe-area-inset-right,0px));
  color-scheme:light;
}
html[data-theme="dark"],html[data-theme="black"]{
  --bg:#171A18; --surface:#20241F; --surface-2:#2A2F2B; --sidebar:#1B1E1C;
  --text:#E6EAE7; --text-2:#A3ADA5; --text-3:#6E7870;
  --res-muted:#8E998F; --res-agg:#64B5F6; --fn:#64B5F6; --com:#6E7870; --neg:#EF7A77;
  --row-border:rgba(255,255,255,.07); --divider:#343B35;
  --row-active:color-mix(in srgb,var(--primary) 16%,var(--bg));
  --total-bg:color-mix(in srgb,var(--primary) 26%,#111); --total-text:#E8F5E9;
  --keypad-bg:#1C1F1D; --key-bg:#2D322E; --key-text:#F1F4F2;
  --key-op-bg:color-mix(in srgb,var(--primary) 30%,#222); --key-op-text:#fff;
  --key-fn-bg:#1D3550; --key-fn-text:#90CAF9; --key-cu-bg:#4A3218; --key-cu-text:#FFCC80;
  --key-nav-bg:#262A27; --key-danger-bg:#4A2426; --key-danger-text:#FFCDD2;
  --border:#3A403C; --overlay:rgba(0,0,0,.6); --danger:#EF5350; --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
html[data-theme="black"]{ --bg:#000; --surface:#0E0F0E; --surface-2:#1A1C1A; --sidebar:#0A0B0A; --keypad-bg:#0A0B0A; --key-bg:#1C1F1D; --divider:#262A27 }

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{
  font-family:system-ui,'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'Noto Sans Devanagari',sans-serif;
  background:var(--bg);color:var(--text);position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;
  overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
}
button{font-family:inherit;color:inherit}
svg.i{width:24px;height:24px;fill:currentColor;display:block}

/* HEADER */
.header{background:var(--primary);color:var(--on-primary);height:calc(var(--header-h) + var(--safe-top));padding-top:var(--safe-top);padding-left:max(4px,var(--safe-left));padding-right:max(4px,var(--safe-right));display:flex;align-items:center;flex-shrink:0;z-index:20;box-shadow:0 2px 4px rgba(0,0,0,.12)}
html[data-theme="dark"] .header,html[data-theme="black"] .header{background:color-mix(in srgb,var(--primary) 32%,#101210)}
.icon-btn{background:none;border:none;color:inherit;cursor:pointer;width:46px;height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .15s,opacity .15s}
.icon-btn:active{background:rgba(255,255,255,.22)}
.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn svg{width:26px;height:26px}
.header-title{flex:1;min-width:0;background:none;border:none;text-align:left;cursor:pointer;padding:4px 10px;border-radius:8px;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.header-title:active{background:rgba(255,255,255,.15)}
.ht-main{font-size:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht-sub{font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht-sub:empty{display:none}
#toolbar{display:flex;align-items:center}

/* EDITOR: textarea on top of a coloured mirror → native select / copy / paste / suggestions */
.workspace{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
.note{display:flex;align-items:stretch;min-height:100%}
.gutter,.rescol{flex-shrink:0;padding-top:var(--ed-top);font-family:var(--editor-font);font-style:var(--editor-style);font-variant-numeric:tabular-nums}
.gutter{width:var(--num-w);text-align:right;color:var(--strong)}
html[data-theme="dark"] .gutter,html[data-theme="black"] .gutter{color:color-mix(in srgb,var(--primary) 75%,#fff)}
.g,.r{overflow:hidden;white-space:nowrap;line-height:var(--row-h);cursor:pointer}
.g{padding-right:6px;font-size:calc(var(--font-size-editor) * .86)}
.g.dl{color:var(--strong);font-weight:700}
body.no-linenums .gutter{width:8px}
body.no-linenums .g{visibility:hidden}
.rescol{width:auto;max-width:48%;text-align:right}
body.fixed-col .rescol{width:var(--result-width);max-width:none}
body.align-left .rescol{text-align:left}
.r{padding:0 12px 0 8px;font-size:var(--font-size-editor);color:var(--res);font-weight:var(--res-weight,400);text-overflow:ellipsis}
.r.muted{color:var(--res-muted)} .r.agg{color:var(--res-agg);font-weight:700} .r.neg{color:var(--neg)}
.r .rt{font-size:.62em;color:var(--text-3);margin-right:6px;font-weight:400}
.r:active{opacity:.6}
body.divider .gutter{border-right:1.5px solid var(--divider)}
body.divider .rescol{border-left:1.5px solid var(--divider)}
.edwrap{position:relative;flex:1;min-width:0}
.mirror,.ed{
  font-family:var(--editor-font);font-style:var(--editor-style);font-size:var(--font-size-editor);line-height:var(--lh);
  padding:var(--ed-top) 8px 45vh 8px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;tab-size:4;letter-spacing:normal;font-kerning:normal;
}
.mirror{color:var(--text);pointer-events:none;min-height:100%}
.ml{min-height:var(--row-h)}
.ml.dl:not(.cur){text-align:center;font-weight:700}
.dmark{background:var(--date-hl,#FFF176);color:var(--date-col,#4A148C);box-shadow:.25em 0 0 var(--date-hl,#FFF176),-.25em 0 0 var(--date-hl,#FFF176);border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.dmark.none{background:none;box-shadow:none}
body.separators .ml,body.separators .g,body.separators .r{box-shadow:inset 0 -1px 0 var(--row-border)}
body.hl-line.focused .ml.cur,body.hl-line.focused .g.cur,body.hl-line.focused .r.cur{background:var(--row-active)}
.ed{
  position:absolute;inset:0;width:100%;height:100%;margin:0;border:0;outline:0;resize:none;overflow:hidden;background:transparent;
  color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--strong);-webkit-user-select:text;user-select:text;display:block;
}
.ed::selection{background:color-mix(in srgb,var(--primary) 38%,transparent);color:transparent}
.ed::spelling-error,.ed::grammar-error{text-decoration:none}
.ed::placeholder{color:var(--text-3);-webkit-text-fill-color:var(--text-3)}
.t-lbl{color:var(--item,var(--strong))}
html[data-theme="dark"] .t-lbl,html[data-theme="black"] .t-lbl{color:var(--item-dark,color-mix(in srgb,var(--primary) 75%,#fff))}
.t-op{color:var(--op)} .t-fn{color:var(--fn)} .t-com{color:var(--com);font-style:italic}

/* NAME SUGGESTIONS */
.suggest{display:none;flex-shrink:0;gap:6px;padding:6px 8px;overflow-x:auto;background:var(--surface);border-top:1px solid var(--row-border);scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}
.suggest.show{display:flex}
.sg{flex-shrink:0;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.sg:active{background:color-mix(in srgb,var(--primary) 25%,var(--surface))}
.sg b{color:var(--strong)}

/* TOTAL BAR */
.total-bar{background:var(--total-bg);color:var(--total-text);min-height:var(--total-h);flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 max(6px,var(--safe-right)) 0 max(6px,var(--safe-left))}
body:not(.kp-open) .total-bar{padding-bottom:var(--safe-bottom);min-height:calc(var(--total-h) + var(--safe-bottom))}
body.no-totalbar .total-bar{display:none}
.kb-switch{display:flex;align-items:center;flex-shrink:0}
.kb-switch button{border:none;background:none;font-weight:500;font-size:21px;padding:8px;border-radius:8px;cursor:pointer;color:var(--strong);opacity:.75}
html[data-theme="dark"] .kb-switch button,html[data-theme="black"] .kb-switch button{color:#C8E6C9}
.kb-switch button.active{opacity:1;font-weight:700;background:rgba(0,0,0,.07)}
.kb-switch button svg{width:30px;height:30px}
body.no-keypad .kb-switch{display:none}
.total-right{flex:1;display:flex;overflow:hidden;padding-right:14px!important;align-items:baseline;justify-content:center;gap:8px;cursor:pointer;padding:8px 10px;border-radius:8px;border:none;background:none;min-width:0;color:inherit;font-style:var(--editor-style);font-family:var(--editor-font)}
.total-right:active{background:rgba(0,0,0,.08)}
.total-label{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.total-value{font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;padding-right:.25em;flex-shrink:0;max-width:75%}
.total-mode{font-size:11px;opacity:.6;white-space:nowrap;font-style:normal}
.total-bar.sel{background:color-mix(in srgb,#1E88E5 22%,#fff);color:#0D47A1}
html[data-theme="dark"] .total-bar.sel,html[data-theme="black"] .total-bar.sel{background:#16324F;color:#BBDEFB}

/* KEYPAD */
.keypad{display:none;flex-shrink:0;background:var(--keypad-bg);padding:6px max(6px,var(--safe-left)) calc(6px + var(--safe-bottom)) max(6px,var(--safe-right));touch-action:manipulation}
body.kp-open .keypad{display:block}
.keypad-tabs{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.keypad-tab{flex:1;padding:7px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:var(--text-2)}
.keypad-tab.active{background:var(--key-bg);color:var(--strong);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.keypad-tab[hidden]{display:none}
.keypad-mini{flex:0 0 auto;min-width:46px;height:32px;border:none;border-radius:8px;cursor:pointer;font-weight:800;font-size:12px;background:var(--key-fn-bg);color:var(--key-fn-text);padding:0 10px;display:flex;align-items:center;justify-content:center}
.keypad-mini.close{background:var(--key-danger-bg);color:var(--key-danger-text);min-width:40px}
.keypad-mini svg{width:18px;height:18px}
.keypad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key{height:var(--key-h);border:none;border-radius:10px;cursor:pointer;background:var(--key-bg);color:var(--key-text);font-size:22px;font-weight:500;box-shadow:0 1px 1.5px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .06s,filter .1s;overflow:hidden;white-space:nowrap;padding:0 4px}
.key:active{transform:scale(.95);filter:brightness(.9)}
.key.op{background:var(--key-op-bg);color:var(--key-op-text);font-weight:700}
.key.fn{background:var(--key-fn-bg);color:var(--key-fn-text);font-size:16px;font-weight:650}
.key.cu{background:var(--key-cu-bg);color:var(--key-cu-text);font-size:17px;font-weight:650}
.key.nav{background:var(--key-nav-bg);font-size:18px}
.key.danger{background:var(--key-danger-bg);color:var(--key-danger-text);font-weight:700;font-size:18px}
.key.eq{background:var(--primary);color:#fff;font-weight:700}
.key.add{background:transparent;border:2px dashed var(--border);box-shadow:none;color:var(--text-2);font-size:14px}

/* OVERLAYS */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:min(88vw,350px);background:var(--sidebar);z-index:61;transform:translateX(-102%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:2px 0 14px rgba(0,0,0,.2)}
.sidebar.open{transform:none}
.sidebar-header{background:var(--primary);color:#fff;padding:calc(18px + var(--safe-top)) 16px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
html[data-theme="dark"] .sidebar-header,html[data-theme="black"] .sidebar-header{background:color-mix(in srgb,var(--primary) 32%,#101210)}
.sidebar-header .logo{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.sidebar-header-title{font-size:20px;font-weight:600}
.sidebar-header-sub{font-size:12px;opacity:.9}
.sidebar-content{flex:1;overflow-y:auto;padding:6px 0 calc(12px + var(--safe-bottom))}
.side-row{display:flex;gap:6px;padding:4px 10px}
.side-btn{flex:1;border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:10px;font-size:14.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.side-btn:active{background:var(--surface-2)}
.side-item{width:100%;border:none;background:none;text-align:left;padding:12px 18px;font-size:15px;color:var(--text);display:flex;align-items:center;gap:16px;cursor:pointer;min-height:48px}
.side-item:active{background:rgba(0,0,0,.07)}
.side-item .ic{width:24px;text-align:center;font-size:18px}
.side-item .cnt{margin-left:auto;font-size:13px;color:var(--text-2)}
.side-section{padding:14px 18px 6px;font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center;gap:8px}
.side-section .chips{margin-left:auto}
.side-section .chip{padding:4px 9px;font-size:11.5px;text-transform:none;letter-spacing:0;border-radius:8px}
.search-wrap{padding:4px 12px 6px}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;outline:none;-webkit-user-select:text;user-select:text;font-family:inherit}
.search:focus{border-color:var(--primary)}
.folder{display:flex;align-items:center;cursor:pointer;min-height:50px;padding-left:12px}
.folder:active{background:rgba(0,0,0,.06)}
.folder .arrow{width:22px;text-align:center;color:var(--text-2);transition:transform .15s;font-size:13px}
.folder.open .arrow{transform:rotate(90deg)}
.folder .fname{flex:1;min-width:0;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder .fcount{font-size:12.5px;color:var(--text-2);margin-right:2px}
.file{display:flex;align-items:center;cursor:pointer;min-height:54px;padding-left:18px;border-right:4px solid transparent}
.file.in{padding-left:44px}
.file:active{background:rgba(0,0,0,.07)}
.file.active{background:color-mix(in srgb,var(--primary) 18%,transparent);border-right-color:var(--primary)}
.file-info{flex:1;min-width:0;padding:7px 0}
.file-title{font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-sub{font-size:12px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-more{border:none;background:none;color:var(--text-2);width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;flex-shrink:0}
.empty-note{padding:10px 18px;color:var(--text-2);font-size:14px}

/* SETTINGS PAGES */
.page{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:#303030;color:#ECECEC;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);visibility:hidden}
html[data-theme="black"] .page{background:#000}
.page.open{transform:none;visibility:visible}
.page-header{display:flex;align-items:center;gap:6px;height:calc(var(--header-h) + var(--safe-top));padding:var(--safe-top) 6px 0;flex-shrink:0;background:#212121;color:#fff}
.page-title{font-size:19px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-body{flex:1;overflow-y:auto;padding:4px 0 calc(28px + var(--safe-bottom))}
.p-section{padding:22px 16px 8px 72px;font-size:15px;color:#80CBC4;font-weight:500}
.p-section:first-child{padding-top:14px}
.p-sep{height:1px;background:#454545;margin:10px 0 0}
.p-item{display:flex;align-items:center;gap:18px;padding:12px 16px;min-height:62px;width:100%;border:none;background:none;color:inherit;text-align:left;cursor:pointer;font-size:16px}
button.p-item:active,label.p-item:active{background:rgba(255,255,255,.07)}
.p-item .p-ic{width:38px;flex-shrink:0;text-align:center;font-size:24px;color:#BDBDBD;display:flex;justify-content:center}
.p-item .p-ic svg{width:32px;height:32px;fill:#BDBDBD}
.p-item .p-txt{flex:1;min-width:0}
.p-item .p-sub{display:block;font-size:13px;color:#A8A8A8;margin-top:3px;line-height:1.35}
.p-item.col{flex-direction:column;align-items:stretch;gap:10px}
.p-item.col .p-row{display:flex;align-items:center;gap:18px}
.p-ctrl{padding-left:56px}
.p-chips{display:flex;gap:7px;flex-wrap:wrap}
.p-chip{border:1.5px solid #5A5A5A;background:#3A3A3A;color:#E0E0E0;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.p-chip.active{border-color:#80CBC4;background:rgba(128,203,196,.18);color:#B2DFDB}
.p-sw{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset}
.swatch.active{border-color:#fff;box-shadow:0 0 0 2px #80CBC4}
.p-range{display:flex;align-items:center;gap:12px}
.p-range input{flex:1;accent-color:#80CBC4}
.p-range b{min-width:52px;text-align:right;font-weight:600;color:#B2DFDB}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#6B6B6B;transition:.2s;border-radius:26px;cursor:pointer}
.slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;top:3px;background:#fff;transition:.2s;border-radius:50%}
.switch input:checked + .slider{background:#26A69A}
.switch input:checked + .slider:before{transform:translateX(20px)}
.p-text{width:100%;min-height:150px;background:#232323;color:#F1F1F1;border:1.5px solid #4A4A4A;border-radius:10px;padding:10px 12px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:text;user-select:text;outline:none;resize:vertical}
.p-text:focus{border-color:#80CBC4}
.p-btn{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;background:#26A69A;color:#fff}
.p-btn.ghost{background:#3D3D3D;color:#E0E0E0}
.p-note{font-size:13px;color:#B0B0B0;line-height:1.5;padding:4px 16px 4px 72px;white-space:pre-wrap}
.p-note.err{color:#EF9A9A}.p-note.ok{color:#A5D6A7}
.list-ed{display:flex;flex-direction:column;gap:6px}
.list-row{display:flex;align-items:center;gap:6px;background:#3A3A3A;border-radius:10px;padding:6px 6px 6px 12px;min-height:48px}
.list-row .lr-main{flex:1;min-width:0;font-size:15px}
.list-row .lr-sub{font-size:12px;color:#A8A8A8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row.off .lr-main{opacity:.45}
.mini{border:none;background:#4A4A4A;color:#EEE;width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:16px;flex-shrink:0}
.mini:disabled{opacity:.3}

/* BOTTOM SHEET */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:var(--surface);color:var(--text);border-radius:20px 20px 0 0;padding:8px 16px calc(18px + var(--safe-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.4,0,.2,1);max-height:90vh;max-height:90dvh;overflow-y:auto;box-shadow:var(--shadow);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
#sheetOverlay{z-index:80}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:2px auto 12px}
.sheet h3{font-size:18px;font-weight:600;margin:0 4px 8px}
.sheet p.msg{font-size:14px;color:var(--text-2);margin:0 4px 8px;line-height:1.5;white-space:pre-wrap}
.sheet label.lbl{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin:14px 4px 6px}
.sheet input[type=text],.sheet input[type=date],.sheet textarea{width:100%;padding:12px 4px 10px;font-size:17px;border:none;border-bottom:2px solid var(--border);border-radius:0;background:transparent;color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none;-webkit-user-select:text;user-select:text}
.sheet input:focus,.sheet textarea:focus{border-bottom-color:var(--primary)}
.sheet .hint{font-size:12.5px;color:var(--text-2);margin:8px 4px 0;line-height:1.5}
.sheet .preview{font-size:14px;margin:8px 4px 0;font-weight:700;color:var(--strong)}
.sheet .preview.err{color:var(--danger)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.chip.active{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--strong)}
.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mode-grid .chip{padding:10px 4px;text-align:center}
.sheet-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.btn{padding:12px 18px;border-radius:12px;border:none;font-size:15px;font-weight:700;cursor:pointer;min-height:46px;flex:1}
.btn.cancel{background:var(--surface-2);color:var(--text)}
.btn.ok{background:var(--primary);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.sheet-actions.text .btn{flex:0 0 auto;background:none;color:var(--strong);text-transform:uppercase;letter-spacing:.5px;min-width:80px}
.sheet-actions.text .btn.danger{color:var(--danger)}
.menu-item{width:100%;display:flex;align-items:center;gap:14px;padding:12px 8px;font-size:15.5px;border:none;background:none;color:var(--text);cursor:pointer;border-radius:10px;text-align:left;min-height:48px}
.menu-item:active{background:var(--surface-2)}
.menu-item .ic{width:26px;text-align:center;font-size:18px}
.menu-item .sub{display:block;font-size:12.5px;color:var(--text-2)}
.menu-item.danger{color:var(--danger)}
.menu-item.on{color:var(--strong);font-weight:700}
.help-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.help-table td{padding:8px 4px;border-bottom:1px solid var(--row-border);vertical-align:top}
.help-table td:first-child{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.help-table td:nth-child(2){text-align:right;color:var(--strong);font-weight:700;white-space:nowrap;padding-right:10px}
.help-table td:last-child{color:var(--text-2);font-size:12.5px}
.doc{font-size:14px;line-height:1.6;color:var(--text-2);white-space:pre-wrap;margin:0 4px}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:14px 4px 0}
.progress i{display:block;height:100%;width:0;background:var(--primary);transition:width .2s}

/* LOCK SCREEN */
.lock{position:fixed;inset:0;z-index:200;background:var(--primary);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom))}
html[data-theme="dark"] .lock,html[data-theme="black"] .lock{background:#121412}
.lock.open{display:flex}
.lock h2{font-size:22px;font-weight:600}
.lock-dots{display:flex;gap:16px;height:20px}
.lock-dots span{width:16px;height:16px;border-radius:50%;border:2px solid #fff}
.lock-dots span.on{background:#fff}
.lock-dots.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.lock-pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.lock-pad button{height:76px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:28px;cursor:pointer}
.lock-pad button:active{background:rgba(255,255,255,.35)}
.lock-pad button.txt{font-size:14px;background:none}
.lock-forgot{background:none;border:none;color:#fff;opacity:.8;font-size:14px;text-decoration:underline;cursor:pointer}

/* SHARE MODAL */
.share-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:none;flex-direction:column;align-items:center;padding:calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom));gap:10px}
.share-modal.open{display:flex}
.share-scroll{flex:1;min-height:0;width:100%;overflow:auto;display:flex;justify-content:center;align-items:flex-start}
.share-preview{max-width:100%;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.5);background:#fff}
.share-opts{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;color:#ddd;font-size:13px;align-items:center}
.share-opts .grp{display:flex;align-items:center;gap:4px}
.share-opts button{border:1.5px solid #555;background:#2a2a2a;color:#eee;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer}
.share-opts button.active{border-color:#81C784;background:#2E5A31;color:#fff}
.share-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.share-btn{padding:12px 18px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;min-height:46px}
.share-btn.secondary{background:#444}

/* TOAST */
.toast{position:fixed;left:50%;bottom:calc(var(--total-h) + var(--safe-bottom) + 20px);transform:translate(-50%,120px);background:#323532;color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;font-weight:500;z-index:300;opacity:0;transition:transform .25s,opacity .25s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
body.kp-open .toast{bottom:auto;top:calc(var(--header-h) + var(--safe-top) + 14px);transform:translate(-50%,-160px)}
.toast.show,body.kp-open .toast.show{transform:translate(-50%,0);opacity:1}

@media (min-width:768px){
  .sheet{max-width:560px;margin:0 auto;left:20px;right:20px;bottom:20px;border-radius:20px}
  .keypad{max-width:560px;width:100%;margin:0 auto;box-shadow:0 0 0 100vmax var(--keypad-bg);clip-path:inset(0 -100vmax)}
  .page-body{max-width:820px;width:100%;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- editing helpers used by keypad / menus ---- */
function focusEd() { if (document.activeElement !== ED) ED.focus({ preventScroll: true }); }
function insertText(str) {

  str = str.replace(/\{date\}/g, fmtDate());

  if (str.includes('{c}')) { caretAt = str.indexOf('{c}'); str = str.replace('{c}', ''); }
  else if (settings.autoBrackets && /\($/.test(str) && ED.value[e] !== ')') { str += ')'; caretAt = str.length - 1; }

}
function backspaceKey() {
  focusEd(); const s = ED.selectionStart, e = ED.selectionEnd;

  if (s === 0) return;

}
function moveCaret(dir) {

}
function clearRow() { focusEd(); const [s, e] = lineBounds(lineOfPos(ED.selectionStart)); replaceRange('', s, e, s); }
function newLineAfterCaretLine() { focusEd(); const [, e] = lineBounds(lineOfPos(ED.selectionStart)); ED.setRangeText('\n', e, e, 'end'); changed(true); caretVisible(); }

  if (cur.trim()) ED.setRangeText('\n' + text + '\n', e, e, 'end'); else ED.setRangeText(text + '\n', s, e, 'end');

}
async function clearAll() {

  const ok = await dialogConfirm({ title: 'Clear all lines?', message: 'Every line in this note will be removed. You can Undo it.', okText: 'Clear all', danger: true });
  if (!ok) return; History.commit(); setValue(''); changed(true); toast('Cleared · Undo to restore');
}
function setLines(lines, caretLine = -1) {
  History.before();
  const v = lines.join('\n'); let pos = v.length;
  if (caretLine >= 0) pos = lineStart(v, caretLine) + (lines[caretLine] || '').length;
  setValue(v, pos); changed(true);
}
async function lineMenu(i) {
  const lines = getTexts(); if (i < 0 || i >= lines.length) return;
  const l = state.calc && state.calc.lines[i]; const isDate = l && l.kind === 'date';
  const key = await dialogMenu(isDate ? lines[i] : `Line ${cells.g[i] ? cells.g[i].textContent : i + 1}`, [
    isDate ? { key: 'date', icon: '📅', label: 'Change date' } : null,
    { key: 'above', icon: '⤒', label: 'Insert line above' }, { key: 'below', icon: '⤓', label: 'Insert line below' },
    { key: 'today', icon: '📅', label: "Insert today's date above" },
    { key: 'dup', icon: '⧉', label: 'Duplicate line' }, { key: 'up', icon: '↑', label: 'Move up' }, { key: 'down', icon: '↓', label: 'Move down' },
    { key: 'copy', icon: '📋', label: 'Copy line' },
    l && l.kind === 'num' ? { key: 'copyres', icon: '🔢', label: 'Copy result' } : null,
    { key: 'del', icon: '🗑', label: 'Delete line', danger: true }
  ]);
  if (!key) return;
  const L = getTexts();
  if (key === 'date') { const d = await pickDate(parseDateLine(L[i]) || new Date()); if (d) { L[i] = fmtDate(d); setLines(L, i); } }
  else if (key === 'above') { L.splice(i, 0, ''); setLines(L, i); ED.focus(); }
  else if (key === 'below') { L.splice(i + 1, 0, ''); setLines(L, i + 1); ED.focus(); }
  else if (key === 'today') { L.splice(i, 0, fmtDate()); setLines(L, i + 1); }
  else if (key === 'dup') { L.splice(i + 1, 0, L[i]); setLines(L, i + 1); }
  else if (key === 'up' && i > 0) { [L[i - 1], L[i]] = [L[i], L[i - 1]]; setLines(L, i - 1); }
  else if (key === 'down' && i < L.length - 1) { [L[i + 1], L[i]] = [L[i], L[i + 1]]; setLines(L, i + 1); }
  else if (key === 'copy') copyText(L[i]).then(ok => toast(ok ? 'Line copied' : 'Copy failed'));
  else if (key === 'copyres') { const v = rawNum(l.value); copyText(v).then(ok => toast(ok ? `Copied ${v}` : 'Copy failed')); }
  else if (key === 'del') { L.splice(i, 1); if (!L.length) L.push(''); setLines(L, Math.min(i, L.length - 1)); toast('Line deleted · Undo available'); }
}
function pickDate(initial) {

    const input = el('input', { type: 'date' }); input.value = `${initial.getFullYear()}-${pad2(initial.getMonth() + 1)}-${pad2(initial.getDate())}`;
    const ok = () => { const [y, m, d] = input.value.split('-').map(Number); Sheet.onClose = null; Sheet.close(); resolve(y ? new Date(y, m - 1, d) : null); };
    Sheet.show(el('div', {}, el('h3', { text: 'Choose date' }), input, el('div', { class: 'sheet-actions text' }, el('button', { class: 'btn cancel', text: 'Cancel', onclick: () => Sheet.close() }), el('button', { class: 'btn ok', text: 'OK', onclick: ok }))), () => resolve(null));
  });
}

/* ---- today's date heading ---- */
function insertTodayHeading() { insertLineHere(fmtDate()); toast("Today's date added"); }
function maybeAutoDate() {
  if (!settings.autoDate || state.pendingDate || document.activeElement !== ED) return;
  History.before();
  const L = getTexts(); const today = new Date();
  const dateIdx = L.map((t, i) => isDateLine(t.trim()) ? i : -1).filter(i => i >= 0);
  if (!dateIdx.length) return;                                    // file does not use dates
  if (dateIdx.some(i => sameDay(parseDateLine(L[i]), today))) return;
  let lastContent = L.length - 1; while (lastContent >= 0 && !L[lastContent].trim()) lastContent--;
  if (lineOfPos(ED.selectionStart) <= lastContent) return;       // editing older entries → leave it
  const heading = fmtDate(today);
  const v = L.slice(0, lastContent + 1).join('\n') + (lastContent >= 0 ? '\n\n' : '') + heading + '\n';
  ED.value = v; ED.setSelectionRange(v.length, v.length);
  state.pendingDate = { end: v.length, heading };
  render(); updateCurLine(); caretVisible(); scheduleSave();
}
function removeEmptyPendingDate() {
  const p = state.pendingDate; if (!p) return; state.pendingDate = null;
  const v = ED.value; if (v.slice(p.end).trim()) return;
  const idx = v.lastIndexOf(p.heading); if (idx < 0) return;
  const before = v.slice(0, idx).replace(/\n+$/, '');
  ED.value = before ? before + '\n' : ''; render(); scheduleSave();
}

/* ---- name suggestions (from all files) ---- */
const sgBar = $('#suggest');
function currentLabels() { return state.calc ? state.calc.lines.filter(l => l.kind === 'num' && l.label && !l.agg).map(l => l.label.split(/\s+/)[0]) : []; }
function labelFreq() {
  const f = new Map(); const add = w => { if (!w || w.length < 2 || /^\d/.test(w)) return; const k = w.toLowerCase(); const cur = f.get(k); f.set(k, { w: cur ? cur.w : w, n: (cur ? cur.n : 0) + 1 }); };
  for (const [id, arr] of Object.entries(state.labelIndex)) if (id !== state.fileId && Array.isArray(arr)) arr.forEach(add);
  currentLabels().forEach(add);
  return [...f.values()].sort((a, b) => b.n - a.n || a.w.localeCompare(b.w));
}
function hideSuggest() { sgBar.classList.remove('show'); }
function updateSuggest() {
  if (!settings.nameSuggest || document.activeElement !== ED || ED.selectionStart !== ED.selectionEnd) return hideSuggest();
  const pos = ED.selectionStart; const [s] = lineBounds(lineOfPos(pos)); const before = ED.value.slice(s, pos);
  if (!/^[^\s\d+\-*/=(:]*$/.test(before)) return hideSuggest();    // only while typing the first word of a line
  const prefix = before.toLowerCase(); const all = labelFreq();
  const list = (prefix ? all.filter(x => x.w.toLowerCase().startsWith(prefix) && x.w.toLowerCase() !== prefix) : all).slice(0, 12);
  if (!list.length) return hideSuggest();
  sgBar.replaceChildren(...list.map(x => el('button', { class: 'sg', 'data-w': x.w, tabindex: '-1', html: prefix ? `<b>${escHtml(x.w.slice(0, prefix.length))}</b>${escHtml(x.w.slice(prefix.length))}` : escHtml(x.w) })));
  sgBar.classList.add('show');
}
sgBar.addEventListener('mousedown', e => e.preventDefault());
sgBar.addEventListener('click', e => {
  const b = e.target.closest('.sg'); if (!b) return; focusEd();
  const pos = ED.selectionStart; const [s] = lineBounds(lineOfPos(pos));

/* ---------------- Undo / Redo ---------------- */
const History = {
  stack: [], idx: -1, timer: null,
  snap() { return { v: ED.value, s: ED.selectionStart, e: ED.selectionEnd }; },
  reset() { clearTimeout(this.timer); this.timer = null; this.stack = [this.snap()]; this.idx = 0; this.ui(); },
  before() { if (this.timer) this.commit(); },            // keep what was typed so far as its own undo step
  schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => this.commit(), 450); this.ui(true); },
  commit() {
    clearTimeout(this.timer); this.timer = null; const s = this.snap(); const cur = this.stack[this.idx];
    if (cur && cur.v === s.v) { cur.s = s.s; cur.e = s.e; this.ui(); return; }
    this.stack = this.stack.slice(0, this.idx + 1); this.stack.push(s); if (this.stack.length > 300) this.stack.shift();
    this.idx = this.stack.length - 1; this.ui();
  },
  undo() { if (!settings.undoEnabled) return; this.commit(); if (this.idx <= 0) { toast('Nothing to undo'); return; } this.idx--; this.apply(this.stack[this.idx]); },
  redo() { if (!settings.undoEnabled) return; if (this.timer) this.commit(); if (this.idx >= this.stack.length - 1) { toast('Nothing to redo'); return; } this.idx++; this.apply(this.stack[this.idx]); },
  apply(s) { state.pendingDate = null; setValue(s.v, s.s, s.e); updateCurLine(); scheduleSave(); this.ui(); },
  ui(pending) { const u = $('#tb-undo'), r = $('#tb-redo'); if (u) u.disabled = !(pending || this.idx > 0); if (r) r.disabled = !(this.idx < this.stack.length - 1) || !!pending; }
};

/* ---------------- Files, folders, recycle bin ---------------- */
const newId = p => (p || 'file_') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function metaOf(f) { return { id: f.id, title: String(f.title || ''), folder: f.folder || '', pinned: !!f.pinned, createdAt: f.createdAt || new Date().toISOString(), updatedAt: f.updatedAt || f.createdAt || new Date().toISOString(), lines: f.lines || 0, totalText: f.totalText || '', deletedAt: f.deletedAt }; }
async function loadLists() {
  const raw = await Store.get('filesList'); state.files = Array.isArray(raw) ? raw.filter(f => f && f.id).map(metaOf) : [];
  const fo = await Store.get('folders'); state.folders = Array.isArray(fo) ? fo.filter(f => f && f.id) : [];
  const tr = await Store.get('trash'); state.trash = Array.isArray(tr) ? tr.filter(f => f && f.id).map(metaOf) : [];
  state.labelIndex = (await Store.get('labelIndex')) || {};
  const cutoff = Date.now() - 30 * 864e5; const old = state.trash.filter(t => new Date(t.deletedAt).getTime() < cutoff);
  if (old.length) { for (const t of old) await Store.remove(t.id); state.trash = state.trash.filter(t => !old.includes(t)); await Store.set('trash', state.trash); }
}
async function saveFileList() { await Store.set('filesList', state.files); renderFileList(); }
const saveFolders = () => Store.set('folders', state.folders);
const saveTrash = () => Store.set('trash', state.trash);
const folderName = id => { const f = state.folders.find(x => x.id === id); return f ? f.name : ''; };

let saveTimer = null, saveChain = Promise.resolve();
function scheduleSave() { if (state.loading) return; state.dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(() => saveNow(), 500); }
function saveNow(showToast = false) {
  clearTimeout(saveTimer); saveTimer = null;
  if (!state.fileId) return saveChain;
  const id = state.fileId, now = new Date().toISOString(), texts = getTexts();
  const totalSnap = JSON.parse(JSON.stringify(state.total)), title = state.title, folder = state.folder;
  const totalText = state.calc && !state.calc.totalError ? fmtNum(state.calc.total) : '';
  const labels = [...new Set(currentLabels())].slice(0, 400);
  state.dirty = false;
  saveChain = saveChain.then(async () => {
    const existing = (await Store.get(id)) || {};
    const m = state.files.find(f => f.id === id);
    const rec = { id, title, folder, pinned: m ? m.pinned : false, rows: texts.map((t, i) => ({ id: 'row_' + (i + 1), text: t })), totalSettings: totalSnap, createdAt: existing.createdAt || now, updatedAt: now };
    await Store.set(id, rec);
    if (m) { m.updatedAt = now; m.title = title; m.folder = folder; m.lines = texts.filter(t => t.trim()).length; m.totalText = totalText; }
    state.labelIndex[id] = labels; Store.set('labelIndex', state.labelIndex);
    await saveFileList();
    if (showToast) toast('Saved ✓');
  }).catch(err => { console.error(err); toast('Could not save – storage full or blocked'); });
  return saveChain;
}
function flushSave() { if (state.dirty || saveTimer) return saveNow(); return saveChain; }
function setTitle(t) { state.title = t; $('#headerName').textContent = displayTitle(); $('#headerFolder').textContent = state.folder ? '📁 ' + folderName(state.folder) : ''; document.title = (t ? t + ' – ' : '') + APP.name; }

async function openFile(id) {
  removeEmptyPendingDate(); await flushSave();
  const rec = await Store.get(id);
  if (!rec) { state.files = state.files.filter(f => f.id !== id); await saveFileList(); return false; }
  state.loading = true; state.fileId = id; state.folder = rec.folder || (state.files.find(f => f.id === id) || {}).folder || '';
  setTitle(String(rec.title || '').replace(/^Untitled( note)?$/i, ''));
  state.total = normTotal(rec.totalSettings);
  const texts = Array.isArray(rec.rows) ? rec.rows.map(r => String((r && r.text) || '')) : [''];
  if (settings.dateOnNew && !texts.some(t => t.trim())) { texts.length = 0; texts.push(fmtDate(), ''); }
  if (texts.length && texts[texts.length - 1].trim() !== '') texts.push('');
  if (document.activeElement === ED) ED.blur();
  state.curLine = -1;
  for (let i = 0; i < htmlCache.length; i++) htmlCache[i] = null;
  const v = texts.join('\n'); ED.value = v; ED.setSelectionRange(v.length, v.length);
  render(true); state.loading = false; state.dirty = false;
  History.reset(); Store.set('lastFileId', id); renderFileList();
  ws.scrollTop = 0;
  if (settings.openAtEnd) { const m = cells.m[cells.m.length - 1]; if (m) { const a = ws.getBoundingClientRect(), b = m.getBoundingClientRect(); if (b.bottom > a.bottom) ws.scrollTop = b.bottom - a.bottom + 40; } }
  if (document.body.classList.contains('kp-open')) ED.focus({ preventScroll: true });
  return true;
}
async function createFile(title = '', texts = null, total, folder = state.folder) {

  const now = new Date().toISOString();
  const rec = { id: newId(), title, folder: folder || '', rows: texts.map((t, i) => ({ id: 'row_' + (i + 1), text: t })), totalSettings: normTotal(total || defaultTotal()), createdAt: now, updatedAt: now };
  await Store.set(rec.id, rec); state.files.unshift(metaOf(rec)); await saveFileList(); await openFile(rec.id);
  return rec.id;
}
async function newFileFlow(folder) { closeSidebar(); await createFile('', null, null, folder === undefined ? state.folder : folder); ED.focus(); ED.setSelectionRange(ED.value.length, ED.value.length); updateCurLine(); toast('New file'); }
function folderChips(selected) {
  const box = el('div', { class: 'chips', style: 'margin-top:6px' }); let value = selected || '';
  const draw = () => box.replaceChildren(...[['', 'No folder'], ...state.folders.map(f => [f.id, '📁 ' + f.name])].map(([id, n]) => el('button', { class: 'chip' + (id === value ? ' active' : ''), 'data-folder': id, text: n, onclick: () => { value = id; draw(); } })),
    el('button', { class: 'chip', text: '＋ New folder', onclick: async () => { const inp = el('input', { type: 'text', placeholder: 'Folder name' }); box.replaceChildren(inp, el('button', { class: 'chip active', text: 'Add', onclick: async () => { const n = inp.value.trim(); if (!n) return; const f = { id: newId('fld_'), name: n, createdAt: new Date().toISOString() }; state.folders.push(f); await saveFolders(); value = f.id; draw(); } })); inp.focus(); } }));

async function folderMenu(id) {

  const key = await dialogMenu('📁 ' + f.name, [
    { key: 'new', icon: '＋', label: 'New file in this folder' }, { key: 'rename', icon: '✏️', label: 'Rename folder' },
    { key: 'del', icon: '🗑', label: 'Delete folder', sub: count ? `${count} file${count === 1 ? '' : 's'} will move out of the folder (not deleted)` : 'Folder is empty', danger: true }
  ]);
  if (key === 'new') newFileFlow(id);
  else if (key === 'rename') { const n = await dialogText({ title: 'Rename folder', label: 'Folder name', value: f.name, okText: 'Rename' }); if (n && n.trim()) { f.name = n.trim(); await saveFolders(); renderFileList(); setTitle(state.title); } }
  else if (key === 'del') {

  const consider = f => { if (!f || typeof f !== 'object' || !Array.isArray(f.rows)) return; const id = typeof f.id === 'string' && f.id ? f.id : newId(); const prev = found.get(id); if (!prev || String(f.updatedAt || '') > String(prev.updatedAt || '')) found.set(id, Object.assign({}, f, { id })); };
  if (Array.isArray(data)) data.forEach(consider);
  else if (data && typeof data === 'object') { if (Array.isArray(data.files)) data.files.forEach(consider); Object.values(data).forEach(v => { if (Array.isArray(v)) v.forEach(consider); else consider(v); }); }
  return [...found.values()];
}
async function importBackupText(text) {
  let data; try { data = JSON.parse(text); } catch (e) { toast('That file is not a valid backup'); return 0; }
  const incoming = extractFiles(data); if (!incoming.length) { toast('No files found in this backup'); return 0; }
  const ok = await dialogConfirm({ title: 'Restore backup?', message: `${incoming.length} file${incoming.length === 1 ? '' : 's'} found. They will be added (nothing is overwritten).`, okText: 'Restore' });
  if (!ok) return 0;
  await flushSave();
  const folderMap = {};
  if (data && Array.isArray(data.folders)) for (const f of data.folders) {
    if (!f || !f.id || !f.name) continue;
    const ex = state.folders.find(x => x.id === f.id || x.name.toLowerCase() === String(f.name).toLowerCase());
    if (ex) folderMap[f.id] = ex.id; else { state.folders.push({ id: f.id, name: String(f.name), createdAt: f.createdAt || new Date().toISOString() }); folderMap[f.id] = f.id; }
  }
  await saveFolders();
  let added = 0, skipped = 0;
  for (const f of incoming) {
    const rowsData = f.rows.map((r, i) => ({ id: 'row_' + (i + 1), text: String((r && (r.text ?? r)) || '').slice(0, 5000) }));
    const existing = state.files.find(m => m.id === f.id);
    if (existing) { const cur = await Store.get(f.id); if (cur && JSON.stringify((cur.rows || []).map(r => r.text)) === JSON.stringify(rowsData.map(r => r.text))) { skipped++; continue; } }
    const rec = { id: existing ? newId() : f.id, title: String(f.title || '').slice(0, 120) + (existing ? ' (restored)' : ''), folder: folderMap[f.folder] || '', pinned: !!f.pinned, rows: rowsData, totalSettings: normTotal(f.totalSettings), createdAt: f.createdAt || new Date().toISOString(), updatedAt: f.updatedAt || new Date().toISOString() };
    const calc = Engine.run(rowsData.map(r => r.text), engineOpts({ total: rec.totalSettings }));
    await Store.set(rec.id, rec);
    state.files.push(Object.assign(metaOf(rec), { lines: rowsData.filter(r => r.text.trim()).length, totalText: calc.totalError ? '' : fmtNum(calc.total) }));
    added++;
  }
  await saveFileList();
  toast(`Restored ${added} file${added === 1 ? '' : 's'}${skipped ? ` · ${skipped} already present` : ''} ✓`, 2800);
  return added;
}

/* ---------------- In-app update (from GitHub Releases) ---------------- */
const Updater = {
  busy: false,
  async current() {
    const up = Native.p('Updater');
    if (up) { try { const i = await up.getInfo(); return { build: Math.max(0, Number(i.versionCode) - 100), name: i.versionName }; } catch (e) {} }
    return { build: APP.build, name: APP.version };
  },
  async latest() {
    const r = await fetch(APP.api, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(); const build = parseInt((String(j.tag_name).match(/build(\d+)/) || [])[1] || '0', 10);
    const asset = (j.assets || []).find(a => /\.apk$/i.test(a.name));
    return { build, tag: j.tag_name, name: j.name || j.tag_name, notes: String(j.body || '').slice(0, 600), apk: asset && asset.browser_download_url, size: asset && asset.size, url: j.html_url };
  },
  async check(silent) {
    if (this.busy) return; this.busy = true;
    try {
      const [cur, lat] = await Promise.all([this.current(), this.latest()]);
      LS.set('cnf_update_checked', String(Date.now()));
      if (!lat.build || lat.build <= cur.build) { if (!silent) toast(`You have the latest version (build ${cur.build || '–'}) ✓`); return; }
      this.offer(cur, lat);
    } catch (e) { if (!silent) toast('Could not check for updates – are you online?'); }
    finally { this.busy = false; }
  },
  offer(cur, lat) {
    const bar = el('div', { class: 'progress', style: 'display:none' }, el('i')); const btn = el('button', { class: 'btn ok', text: Native.on ? 'Update now' : 'Reload app' });
    const status = el('p', { class: 'hint', text: `Installed: build ${cur.build || '–'}   →   New: build ${lat.build}${lat.size ? ` · ${(lat.size / 1048576).toFixed(1)} MB` : ''}` });
    btn.addEventListener('click', async () => {
      if (!Native.on) { location.reload(); return; }
      const up = Native.p('Updater'); if (!up || !lat.apk) { openLink(lat.url); return; }
      btn.disabled = true; bar.style.display = ''; status.textContent = 'Downloading…';
      let handle = null;
      try {
        handle = await up.addListener('progress', p => { bar.firstChild.style.width = (p.percent || 0) + '%'; status.textContent = `Downloading… ${p.percent || 0}%`; });
        const r = await up.download({ url: lat.apk });
        status.textContent = 'Opening installer…';
        try { await up.install({ path: r.path }); status.textContent = 'Tap "Update" on the next screen. Your files are kept.'; }
        catch (e) {
          if (/NEED_PERMISSION|permission/i.test(String((e && (e.code || e.message)) || ''))) status.textContent = 'Allow "Install unknown apps" for CalcNote Freedom, come back and tap Update again.';
          else throw e;
        }
      } catch (e) { status.textContent = 'Update failed: ' + ((e && e.message) || e) + ' – you can also update from the Releases page.'; }
      finally { btn.disabled = false; if (handle && handle.remove) handle.remove(); }
    });
    Sheet.show(el('div', {}, el('h3', { text: '⬆️ Update available' }), el('p', { class: 'msg', text: `${lat.name}` }), status, bar,
      lat.notes ? el('p', { class: 'hint', text: lat.notes.replace(/\r/g, '') }) : null,
      el('div', { class: 'sheet-actions' }, el('button', { class: 'btn cancel', text: 'Later', onclick: () => Sheet.close() }), btn)));
  },
  auto() { if (!settings.autoUpdate || !Native.on) return; const last = +LS.get('cnf_update_checked', '0'); if (Date.now() - last > 20 * 3600 * 1000) setTimeout(() => this.check(true), 4000); }
};

/* ---------------- App lock ---------------- */
async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  try { if (crypto && crypto.subtle) { const h = await crypto.subtle.digest('SHA-256', data); return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join(''); } } catch (e) {}
  let h = 2166136261; for (const b of data) { h ^= b; h = Math.imul(h, 16777619); } return 'f' + (h >>> 0).toString(16);
}
const Lock = {
  entry: '', resolve: null, hiddenAt: 0,
  build() { const pad = $('#lockPad'); if (pad.childElementCount) return; ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].forEach(k => pad.append(el('button', { class: k === '⌫' ? 'txt' : '', text: k, style: k ? '' : 'visibility:hidden', onclick: () => this.key(k) }))); $('#lockForgot').addEventListener('click', () => this.forgot()); },
  dots(n = 4) { $('#lockDots').replaceChildren(...Array.from({ length: Math.max(n, this.entry.length) }, (_, i) => el('span', { class: i < this.entry.length ? 'on' : '' }))); },
  ask(msg, { allowForgot = true } = {}) { this.build(); this.entry = ''; $('#lockMsg').textContent = msg; $('#lockForgot').style.display = allowForgot ? '' : 'none'; this.dots(); $('#lock').classList.add('open'); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); return new Promise(r => { this.resolve = r; }); },
  key(k) { keyFeedback(); if (k === '⌫') this.entry = this.entry.slice(0, -1); else if (this.entry.length < 8) this.entry += k; this.dots(); if (this.entry.length >= 4 && this.resolve) { const r = this.resolve; const v = this.entry; clearTimeout(this.t); this.t = setTimeout(() => { if (this.entry === v) r(v); }, this.entry.length >= 6 ? 0 : 450); } },
  fail(msg) { this.entry = ''; this.dots(); $('#lockMsg').textContent = msg; const d = $('#lockDots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); },
  close() { $('#lock').classList.remove('open'); this.resolve = null; },
  async unlock() { if (!settings.lock || !settings.pinHash) return; let msg = 'Enter PIN'; for (;;) { const pin = await this.ask(msg); if ((await hashPin(pin, settings.pinSalt)) === settings.pinHash) { this.close(); return; } msg = 'Wrong PIN – try again'; this.fail(msg); await new Promise(r => setTimeout(r, 350)); } },
  async setup() {
    const a = await this.ask('Choose a PIN (4–8 digits)', { allowForgot: false }); this.entry = ''; this.dots();
    const b = await this.ask('Enter the same PIN again', { allowForgot: false }); this.close();
    if (a !== b) { toast('PINs did not match – lock not enabled'); return false; }
    const salt = Math.random().toString(36).slice(2); settings.pinSalt = salt; settings.pinHash = await hashPin(a, salt); settings.lock = true; persistSettings(); toast('App lock enabled 🔒'); return true;
  },
  async forgot() {
    const ok = await dialogConfirm({ title: 'Forgot PIN?', message: 'The PIN cannot be recovered. You can erase ALL files and settings to use the app again. Export a backup regularly to avoid this.', okText: 'Erase everything', danger: true }); if (!ok) return;
    const typed = await dialogText({ title: 'Type DELETE to confirm', value: '', okText: 'Erase' }); if (typed !== 'DELETE') return toast('Cancelled');
    await Store.clear(); LS.del(SKEY); location.reload();
  }
};
